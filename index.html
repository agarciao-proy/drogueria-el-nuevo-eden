<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>El Nuevo Edén | Prototipo</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6f3;color:#17352e;font:16px system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:11px 15px;background:#12604e;color:white;font-weight:650}button:hover{filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #327f6c;outline-offset:3px}.lite{background:#e2f1e9;color:#125644}.plain{background:transparent;color:#125644;border-color:#d5e4db}.split{display:grid;grid-template-columns:minmax(300px,36%) 1fr;min-height:100dvh}.cover,aside{background:#113b32;color:white}.cover{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(26px,5vw,58px) 5vw}.cover h1{font-size:clamp(30px,4vw,50px);line-height:1.08;letter-spacing:-.035em;margin:0}.cover p,.cover small{color:#c6e1d5}.logo{font-weight:750}.cross{display:inline-grid;place-items:center;background:#2e7966;border-radius:8px;width:30px;height:30px;margin-right:9px}.entry{display:grid;align-content:center;padding:5vw}.entry>div,.entry>form{width:min(100%,570px);margin:auto}.entry h2{font-size:38px;letter-spacing:-.035em;margin:0}.entry p{margin:8px 0 20px}.pick{width:100%;text-align:left;display:block;margin-top:14px;padding:18px 22px;position:relative}.pick::after{content:'›';position:absolute;right:20px;top:24px;font-size:26px}.pick strong,.pick small{display:block}.pick small{font-weight:400;margin:6px 24px 0 0}.pick.lite{background:white;border-color:#d5e4db;color:#17352e}.card{background:white;border:1px solid #d5e4db;border-radius:14px;padding:24px}.entry .card{padding:34px}.sub,.muted,small{color:#47645b}.pick:not(.lite) small{color:#e2f1e9}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.entry .formgrid{grid-template-columns:1fr}.field{display:grid;gap:6px;font-size:14px;font-weight:650}.field input,.field select,input.search{width:100%;padding:10px 12px;border:1px solid #abc2b8;background:#fff;color:#17352e;border-radius:8px;min-height:43px}.tools,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.actions{margin-top:20px}.field input[readonly]{background:#f1f6f3}.error,.ok{padding:11px 14px;border-radius:8px;color:#822537;background:#fcebec;margin:12px 0}.ok{color:#125644;background:#e2f1e9}.app{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:100dvh}aside{padding:20px 12px}aside .logo,aside small{display:block;margin:6px 8px}aside small{color:#c6e1d5}aside nav{display:grid;gap:4px;margin-top:25px}aside nav button{background:transparent;text-align:left;color:white}aside nav button[aria-current=page]{background:#286456}header{background:#fff;min-height:61px;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;gap:10px;border-bottom:1px solid #d5e4db}main{padding:24px clamp(15px,3vw,36px);max-width:1350px;margin:auto}main h1{font-size:clamp(26px,4vw,37px);letter-spacing:-.035em;margin:0}main>p{margin:6px 0 22px}.summary{margin:0}.summary div{border-bottom:1px solid #d5e4db;padding:12px 0}.summary dt{color:#12604e;font-weight:700}.summary dd{margin:3px 0 0}.tablebox{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #d5e4db;font-size:14px}th{background:#e2f1e9}.search{max-width:360px}.wide{width:100%}.inline{display:flex;gap:8px;align-items:end}.inline input{flex:1}.center{margin-top:18px}.split a{color:#125644}.foot{margin-top:20px;font-size:13px}.pill{font-size:13px;font-weight:750;color:#125644}.nobreak{white-space:nowrap}@media(max-width:730px){.split,.app{grid-template-columns:1fr}.cover{gap:18px}.cover h1 br{display:none}.cover small{display:none}.entry{padding:25px 16px}.app aside nav{display:flex;overflow:auto;margin-top:12px}.app aside nav button{white-space:nowrap}.formgrid{grid-template-columns:1fr}header{padding:8px 12px}.entry .card{padding:22px}}</style><body><noscript>Activa JavaScript para recorrer el prototipo.</noscript><div id="root"></div><script>const R={A:'Administración',V:'Ventas y Dispensación'}, NAV={"A": {"home": "Inicio", "products": "Productos", "lots": "Lotes y movimientos", "stock": "Existencias", "expiry": "Vencimientos", "sales": "Ventas", "alerts": "Alertas", "reports": "Reportes", "users": "Usuarios"}, "V": {"home": "Inicio", "stock": "Existencias", "expiry": "Vencimientos", "sales": "Ventas", "alerts": "Alertas"}}, DAY='2026-09-30';
const C={admin:{r:'A',pw:'Eden2026'},ventas01:{r:'V',pw:'Eden2026'},ventas02:{r:'V',pw:'Eden2026'}};
const initial={p:[{id:'MED-001',name:'Acetaminofén 500 mg',pack:'Caja x 20',price:5800},{id:'MED-002',name:'Loratadina 10 mg',pack:'Caja x 10',price:7400},{id:'MED-003',name:'Sales de rehidratación oral',pack:'Sobre',price:3200}],l:[{id:'AC-120',p:'MED-001',exp:'2026-10-24',qty:12},{id:'AC-257',p:'MED-001',exp:'2027-05-30',qty:8},{id:'LO-142',p:'MED-002',exp:'2027-01-31',qty:4},{id:'SR-093',p:'MED-003',exp:'2026-09-20',qty:3}],s:[{id:'V-001',day:DAY,user:'ventas01',lot:'AC-120',qty:2,total:11600}],m:[]};
let db=JSON.parse(JSON.stringify(initial));try{db=JSON.parse(localStorage.getItem('eden_demo_26_v4'))||db}catch(e){};
let role='',user='',loginRole='',view='portal',note='',receipt=null,report=null;const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cop=n=>'$ '+new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(n)+' COP';const date=s=>s.split('-').reverse().join('/');const product=l=>db.p.find(p=>p.id===l.p);const days=l=>Math.round((Date.parse(l.exp)-Date.parse(DAY))/86400000);const save=()=>{try{localStorage.setItem('eden_demo_26_v4',JSON.stringify(db))}catch(e){}};
const button=(s,k,cls='')=>`<button type="button" class="${cls}" data-go="${k}">${s}</button>`;const input=(n,label,type='text',attrs='')=>`<label class="field">${label}<input name="${n}" type="${type}" ${attrs}></label>`;const selects=(n,label,os)=>`<label class="field">${label}<select name="${n}" required>${os}</select></label>`;const opt=(id,label)=>`<option value="${esc(id)}">${esc(label)}</option>`;
const notice=()=>`<div id="msg" role="status">${note?`<p class="ok">${esc(note)}</p>`:''}</div>`;function err(s){const m=document.getElementById('msg');m.innerHTML=`<p class="error" role="alert">${esc(s)}</p>`;}
function go(k,msg=''){if(k==='logout'){role='';user='';report=null;receipt=null;k='portal'}if(k==='loginA'||k==='loginV'){loginRole=k.at(-1);k='login'}if(!['portal','login'].includes(k)){const more=role==='A'?['productForm','lotForm','adjustForm','saleForm','saleOk']:['saleForm','saleOk'];if(!role||(!Object.keys(NAV[role]).includes(k)&&!more.includes(k)))k='portal'} note=msg;view=k;draw();window.scrollTo(0,0)}
function table(h,rows){return `<div class="tablebox"><table><thead><tr>${h.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}<tr data-empty${rows.length?' hidden':''}><td colspan="${h.length}">No hay resultados para esta consulta.</td></tr></tbody></table></div>`;}
const search='<input type="search" id="search" class="search" aria-label="Buscar en la tabla" placeholder="Buscar por texto…">';
function access(){const p=view==='portal';root.innerHTML=`<div class="split"><div class="cover"><div class="logo"><span class="cross">+</span>Droguería El Nuevo Edén</div><div><h1>${p?'Bienvenido a<br> El Nuevo Edén':'Inventario y ventas<br> en un solo lugar'}</h1><p>${p?'Gestión de inventarios y ventas.':'Gestión interna'}</p></div><small>Magangué, Bolívar</small></div><div class="entry">${p?`<div><h2>Elige un perfil</h2><p class="sub">Selecciona una opción según tu perfil.</p><button class="pick" data-go="loginA"><strong>Administración</strong><small>Productos, lotes, inventario y reportes.</small></button><button class="pick lite" data-go="loginV"><strong>Ventas y Dispensación</strong><small>Consulta de existencias y registro de ventas.</small></button><p class="foot muted">Para ingresar necesitas una cuenta asignada por Administración.</p></div>`:`<form class="card" data-form="login"><h2>Iniciar sesión</h2><p><strong>${R[loginRole]}</strong><br><span class="sub">Usa la cuenta asignada por Administración.</span></p><div class="formgrid">${input('u','Usuario','text','required autocomplete="username" placeholder="Escribe tu usuario"')}<div class="inline">${input('pw','Contraseña','password','required autocomplete="current-password"')}<button class="plain" type="button" data-go="toggle" aria-pressed="false">Mostrar</button></div></div>${notice()}<button class="wide center">Ingresar</button><p class="foot muted">Cuenta demo: <strong>${loginRole==='A'?'admin':'ventas01 o ventas02'}</strong> · Contraseña: <strong>Eden2026</strong></p>${button('‹ Volver al portal','portal','plain')}</form>`}</div></div>`;}
function form(id,fields,submit,back){return `<form class="card" data-form="${id}"><div class="formgrid">${fields}</div>${notice()}<div class="actions"><button>${submit}</button>${button('Cancelar',back,'lite')}</div></form>`}
const productOptions=()=>db.p.map(p=>opt(p.id,p.id+' · '+p.name)).join('');const lotOptions=(only=false)=>db.l.filter(l=>!only||(days(l)>=0&&l.qty>0)).sort((a,b)=>a.exp.localeCompare(b.exp)).map(l=>opt(l.id,l.id+' · '+product(l).name+' ('+l.qty+')')).join('');
const salesRows=a=>a.map(s=>[s.id,date(s.day),s.user,cop(s.total)]);const salesHead=['N.º','Fecha','Operador','Total (COP)'];
function template(){let title='',sub='',html='';const box=(inside)=>`<div class="card">${notice()}${inside}</div>`;switch(view){
case 'home': title=role==='A'?'Panel de administración':'Panel de ventas';sub='Resumen operativo · 30 de septiembre de 2026 · Datos de demostración';{const a=db.l.find(l=>l.id==='AC-120'), n=db.l.filter(l=>days(l)>=0&&days(l)<=30&&l.qty>0).length;html=box(`<dl class="summary"><div><dt>Existencias</dt><dd>Acetaminofén 500 mg: ${a.qty} cajas disponibles en el lote ${a.id}.</dd></div><div><dt>Vencimientos</dt><dd>${n} ${n===1?'lote próximo':'lotes próximos'} a vencer.</dd></div><div><dt>Acceso rápido</dt><dd>Registra ventas y consulta existencias.</dd></div></dl><div class="actions">${button('Registrar venta','saleForm')}${button('Consultar existencias','stock','lite')}</div>`)}break;
case 'products':title='Catálogo de productos';sub='Crea y consulta referencias de medicamentos.';html=box(`<div class="tools">${search}${button('Nuevo producto','productForm')}</div>`+table(['Código','Producto','Presentación','Precio (COP)'],db.p.map(p=>[p.id,p.name,p.pack,cop(p.price)])));break;
case 'productForm':title='Registrar producto';sub='Crea la referencia antes de asignarle un lote.';html=form('product',input('id','Código','text','required maxlength="24"')+input('name','Nombre del producto','text','required maxlength="70"')+input('pack','Presentación','text','required maxlength="45"')+input('price','Precio de venta (COP)','number','required min="1" step="1"'),'Guardar producto','products');break;
case 'lots':title='Lotes y movimientos';sub='Registra entradas y ajustes; consulta las salidas por venta.';html=box(`<div class="tools">${search}${button('Registrar entrada','lotForm')}${button('Registrar ajuste','adjustForm','lite')}</div>`+table(['Lote','Producto','Vence','Saldo'],db.l.map(l=>[l.id,product(l).name,date(l.exp),l.qty]))+`<h3>Movimientos recientes</h3>`+table(['Fecha','Tipo','Lote','Variación','Operador','Motivo'],db.m.map(m=>[date(m.day),m.kind,m.lot,m.delta,m.user,m.why])));break;
case 'lotForm':title='Registrar lote / entrada';sub='Si el lote existe, deben coincidir el producto y el vencimiento.';html=form('lot',selects('p','Producto',productOptions())+input('id','Código de lote','text','required maxlength="24"')+input('exp','Fecha de vencimiento','date','required')+input('qty','Cantidad de entrada','number','required min="1" step="1"'),'Guardar entrada','lots');break;
case 'adjustForm':title='Registrar ajuste';sub='La variación puede ser positiva o negativa. El saldo no puede quedar negativo.';html=form('adjust',selects('lot','Lote',lotOptions())+input('delta','Variación (+/−)','number','required step="1"')+input('why','Motivo','text','required maxlength="85"'),'Guardar ajuste','lots');break;
case 'stock':title='Existencias';sub='Consulta el saldo por producto y lote. Los lotes vencidos se muestran como no disponibles.';html=box(search+table(['Producto','Lote','Vence','Disponible'],db.l.map(l=>[product(l).name,l.id,date(l.exp),days(l)<0?'0 (lote vencido)':l.qty])));break;
case 'expiry':title='Vencimientos';sub='Ordenados por fecha de vencimiento, del más antiguo al más reciente.';html=box(search+table(['Producto','Lote','Vence','Estado'],[...db.l].sort((a,b)=>a.exp.localeCompare(b.exp)).map(l=>[product(l).name,l.id,date(l.exp),days(l)<0?'Vencido · no disponible':days(l)<=30?'Próximo · '+days(l)+' días':'Vigente'])));break;
case 'sales':title='Ventas';sub=role==='A'?'Historial de ventas de la demostración.':'Ventas registradas con tu cuenta de demostración.';html=box(`<div class="tools">${search}${button('Nueva venta','saleForm')}</div>`+table(salesHead,salesRows([...db.s].reverse().filter(s=>role==='A'||s.user===user))));break;
case 'saleForm':title='Registrar venta';sub='Solo se ofrecen lotes aptos con saldo, ordenados por vencimiento (FEFO).';html=db.l.some(l=>l.qty>0&&days(l)>=0)?form('sale',selects('lot','Lote',lotOptions(true))+input('qty','Cantidad','number','required min="1" step="1" value="1"')+input('unit','Precio unitario (COP)','text','readonly')+input('total','Total (COP)','text','readonly'),'Confirmar venta','sales'):box('<p>No hay lotes aptos con saldo disponible.</p>');break;
case 'saleOk':title='Venta confirmada';sub='La salida fue registrada en la demostración.';html=receipt?box(`<h2>${esc(receipt.id)} · ${esc(receipt.name)}</h2><p>Lote ${esc(receipt.lot)} · ${receipt.qty} unidades · ${cop(receipt.total)}</p><p><strong>Saldo del lote: ${receipt.before} → ${receipt.after} unidades</strong></p><div class="actions">${button('Consultar existencias','stock')}${button('Ver ventas','sales','lite')}</div>`):box('<p>No hay una venta seleccionada.</p>');break;
case 'alerts':title='Alertas';sub='Vencido, próximo a vencer (hasta 30 días) y stock apto bajo (hasta 5 unidades por lote).';{const a=[];for(const l of db.l){const n=days(l),name=product(l).name;if(l.qty&&n<0)a.push(['Vencido',name,l.id,'No disponible']);if(l.qty&&n>=0&&n<=30)a.push(['Vencimiento próximo',name,l.id,n+' días restantes']);if(n>=0&&l.qty<=5)a.push(['Stock bajo',name,l.id,l.qty+' unidades disponibles']);}html=box(search+table(['Tipo','Producto','Lote','Detalle'],a));}break;
case 'reports':title=report?'Reporte generado':'Reportes operativos';sub='Filtra las ventas por fechas y consulta el total del periodo en COP.';html=`<div class="card"><form data-form="report"><div class="formgrid">${input('from','Desde','date',`required value="${report?.from||'2026-09-01'}"`)}${input('to','Hasta','date',`required value="${report?.to||DAY}"`)}</div>${notice()}<div class="actions"><button>Generar reporte</button></div></form>${report?`<p><strong>Total del periodo: ${cop(report.rows.reduce((a,x)=>a+x.total,0))}</strong></p>`+table(salesHead,salesRows(report.rows)):''}</div>`;break;
case 'users': title='Usuarios';sub='Cuentas de demostración y permisos asignados a cada perfil.';html=box(table(['Usuario','Rol','Estado'],Object.entries(C).map(([u,v])=>[u,R[v.r],'Activo'])));break;
}return [title,sub,html]}
function draw(){if(view==='portal'||view==='login'){access();return}const [title,sub,html]=template();const active=({productForm:'products',lotForm:'lots',adjustForm:'lots',saleForm:'sales',saleOk:'sales'})[view]||view;root.innerHTML=`<div class="app"><aside><div class="logo">+ El Nuevo Edén</div><small>Gestión interna</small><nav aria-label="Menú del perfil">${Object.entries(NAV[role]).map(([k,n])=>`<button type="button" data-go="${k}" ${active===k?'aria-current="page"':''}>${n}</button>`).join('')}</nav></aside><div><header><strong>Droguería El Nuevo Edén</strong><span class="pill">${R[role]} · ${esc(user)}</span>${button('Cerrar sesión','logout','plain')}</header><main><h1>${title}</h1><p class="sub">${sub}</p>${html}<p class="foot muted">Prototipo local con datos de demostración. No usar con datos reales.</p></main></div></div>`;refreshSale();}
function refreshSale(){const f=root.querySelector('[data-form="sale"]');if(!f)return;const l=db.l.find(l=>l.id===f.elements.lot.value);if(!l)return;f.elements.unit.value=cop(product(l).price);f.elements.total.value=cop(product(l).price*(Number(f.elements.qty.value)||0));}
root.addEventListener('click',e=>{const btn=e.target.closest('[data-go]');if(!btn)return;const k=btn.dataset.go;if(k==='toggle'){const p=btn.form.elements.pw;const show=p.type==='password';p.type=show?'text':'password';btn.textContent=show?'Ocultar':'Mostrar';btn.setAttribute('aria-pressed',String(show));return}go(k)});
root.addEventListener('input',e=>{if(e.target.id==='search'){const box=e.target.closest('.card');const q=e.target.value.trim().toLocaleLowerCase('es');const tb=box.querySelector('tbody');if(!tb)return;let n=0;for(const row of tb.querySelectorAll('tr:not([data-empty])')){row.hidden=!row.textContent.toLocaleLowerCase('es').includes(q);n+=!row.hidden}tb.querySelector('[data-empty]').hidden=n>0;}refreshSale()});root.addEventListener('change',refreshSale);
const movement=(kind,l,delta,why)=>db.m.unshift({day:DAY,kind,lot:l.id,delta,user,why});
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,data=Object.fromEntries(new FormData(f));if(k==='login'){const u=data.u.trim().toLowerCase();const a=Object.hasOwn(C,u)?C[u]:null;if(!a||a.pw!==data.pw||a.r!==loginRole)return err('Usuario o contraseña incorrectos para este acceso.');role=a.r;user=u;return go('home')}
if(!role||(['product','lot','adjust','report'].includes(k)&&role!=='A'))return;
if(k==='product'){const id=data.id.trim().toUpperCase(),name=data.name.trim(),pack=data.pack.trim(),price=Number(data.price);if(!id||!name||!pack||!Number.isSafeInteger(price)||price<1)return err('Completa todos los campos con valores válidos.');if(db.p.some(p=>p.id===id))return err('Ese código ya existe.');db.p.push({id,name,pack,price});save();return go('products','Producto registrado.')}
if(k==='lot'){const id=data.id.trim().toUpperCase(),qty=Number(data.qty);let l=db.l.find(l=>l.id===id);if(!id||!Number.isSafeInteger(qty)||qty<1||data.exp<DAY)return err('Comprueba el código, la cantidad y que el lote no esté vencido.');if(l&&(l.p!==data.p||l.exp!==data.exp))return err('El lote ya existe con otro producto o vencimiento.');if(!l){l={id,p:data.p,exp:data.exp,qty:0};db.l.push(l)}l.qty+=qty;movement('Entrada',l,qty,'Recepción');save();return go('lots','Entrada registrada y saldo actualizado.')}
if(k==='adjust'){const l=db.l.find(l=>l.id===data.lot),n=Number(data.delta),why=data.why.trim();if(!l||!why||!Number.isSafeInteger(n)||!n||l.qty+n<0)return err('Indica un motivo y una variación distinta de cero que no deje saldo negativo.');l.qty+=n;movement('Ajuste',l,n,why);save();return go('lots','Ajuste aplicado.')}
if(k==='sale'){const l=db.l.find(l=>l.id===data.lot),n=Number(data.qty);if(!l||days(l)<0)return err('Lote no apto para venta.');if(!Number.isSafeInteger(n)||n<1)return err('Ingresa una cantidad entera mayor que cero.');if(n>l.qty)return err(`Saldo insuficiente. Hay ${l.qty} unidades disponibles para este lote.`);const before=l.qty;l.qty-=n;const sale={id:'V-'+String(db.s.length+1).padStart(3,'0'),day:DAY,user,lot:l.id,qty:n,total:n*product(l).price};db.s.push(sale);movement('Venta',l,-n,sale.id);receipt={...sale,name:product(l).name,before,after:l.qty};save();return go('saleOk')}
if(k==='report'){if(data.from>data.to)return err('La fecha inicial no puede ser posterior a la final.');report={...data,rows:db.s.filter(s=>s.day>=data.from&&s.day<=data.to)};return go('reports')}
});draw();</script></body></html>
